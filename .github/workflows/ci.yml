name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (from lockfile)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Test (offline; uses synthetic models and the committed artifact)
        run: uv run pytest -q

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        # mvnw is committed without the executable bit, so invoke it via sh.
        run: sh ./mvnw -B test
